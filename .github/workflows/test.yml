name: Test

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**.md'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore: *docs
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # When called from release.yml, github.workflow is the caller's name, so a
  # release's test run never cancels (or is cancelled by) a direct Test run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # release.yml tests release commits itself, so skip the direct push run.
    if: "inputs.release || !startsWith(github.event.head_commit.message, 'release: ')"
    strategy:
      fail-fast: false
      matrix:
        # PRs run only the oldest toolchain, which is where most failures show up.
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os":"macos-15","xcode":"16.2"}]'
          || '[{"os":"macos-15","xcode":"16.2"},{"os":"macos-26","xcode":"26.2"},{"os":"xcode-27","xcode":"27.1"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Build and test
        run: >
          xcodebuild test
          -project Harvie.xcodeproj
          -scheme Harvie
          -destination 'platform=macOS'
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test release script
        run: python3 scripts/test_release.py
